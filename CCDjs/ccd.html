<!DOCTYPE html>
<html>
<head>
    <title>CCD</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: brown;
        }

        #container {
            width: 300px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid brown;
        }
    </style>
</head>

<body>

<h1>CCD</h1>

<div id="container">

    <h3>Menu</h3>

    <input type="radio" name="bev"
        onclick="document.write('Selected Beverage: Tea<br>Total Amount: ₹20')">
    Tea (₹20)<br><br>

    <input type="radio" name="bev"
        onclick="document.write('Selected Beverage: Coffee<br>Total Amount: ₹30')">
    Coffee (₹30)<br><br>

    <input type="radio" name="bev"
        onclick="document.write('Selected Beverage: Milk<br>Total Amount: ₹15')">
    Milk (₹15)<br><br>

    <input type="radio" name="bev"
        onclick="document.write('Selected Beverage: Water<br>Total Amount: ₹10')">
    Water (₹10)<br><br>

</div>

</body>
</html>
